<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Carteirinha Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-green-500">Nova Senha</h1>
            <p class="text-gray-400 text-sm mt-1">Insere a tua nova palavra-passe de acesso</p>
        </div>

        <form id="redefinirForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Nova Senha</label>
                <input type="password" id="novaSenha" required minlength="6"
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-green-500 transition" 
                    placeholder="Mínimo 6 caracteres">
            </div>

            <button type="submit" id="btnSalvar" 
                class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                Atualizar Senha
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-xs text-gray-400 hover:text-white transition">
                ← Voltar para o Login
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alert('Token de redefinição inválido ou em falta.');
            window.location.href = 'login.html';
        }

        document.getElementById('redefinirForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const novaSenha = document.getElementById('novaSenha').value;
            const btn = document.getElementById('btnSalvar');

            btn.disabled = true;
            btn.innerText = 'A atualizar...';

            try {
                const res = await fetch('/api/pagamento?action=redefinir-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, novaSenha })
                });

                const data = await res.json();

                if (res.ok) {
                    alert(data.message || 'Senha alterada com sucesso!');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Erro ao redefinir a senha.');
                    btn.disabled = false;
                    btn.innerText = 'Atualizar Senha';
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
                btn.disabled = false;
                btn.innerText = 'Atualizar Senha';
            }
        });
    </script>
</body>
</html>
