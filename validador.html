<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Oficial de Autenticidade - DNE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .validator-container {
            background: #1e293b;
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        .validator-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        .validator-header i { font-size: 24px; color: #3b82f6; }
        .validator-header h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; color: #cbd5e1; }
        
        /* ESTADOS DE CARREGAMENTO */
        #loading-state { padding: 30px 0; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* RESULTADO VÁLIDO / INVÁLIDO */
        .result-box { display: none; text-align: left; }
        .status-badge-valid {
            background: rgba(22, 163, 74, 0.15);
            border: 2px solid #16a34a;
            color: #4ade80;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status-badge-invalid {
            background: rgba(220, 38, 38, 0.15);
            border: 2px solid #dc2626;
            color: #f87171;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .info-grid {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        .info-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .info-label { color: #94a3b8; font-weight: 600; }
        .info-value { color: #ffffff; font-weight: 700; text-align: right; }

        .btn-action {
            display: block;
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            transition: background 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-action:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="validator-container">
        <div class="validator-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h2>Validador Nacional ITI</h2>
        </div>

        <!-- TELA DE PROCESSAMENTO -->
        <div id="loading-state">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: #94a3b8; font-weight: 600;">Consultando base de dados oficial e criptografia ICP-Brasil...</p>
        </div>

        <!-- TELA DE RESULTADO (DINÂMICA) -->
        <div id="result-state" class="result-box">
            <div id="status-badge-container"></div>

            <div class="info-grid" id="details-container">
                <!-- Preenchido via JavaScript -->
            </div>

            <a href="index.html" class="btn-action">Voltar ao Início / Portal DNE</a>
        </div>
    </div>

    <script>
        // Simula a leitura e validação baseada nos parâmetros da URL (ex: ?token=DNE-VALIDADO-12345678900 ou ?cpf=...)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token') || urlParams.get('cpf');

            setTimeout(() => {
                document.getElementById('loading-state').style.display = 'none';
                const resultState = document.getElementById('result-state');
                resultState.style.display = 'block';

                const badgeContainer = document.getElementById('status-badge-container');
                const detailsContainer = document.getElementById('details-container');
                const proximoAno = new Date().getFullYear() + 1;

                // Critério de validação: Se houver um token/CPF válido na URL
                if (token && token.length >= 8) {
                    badgeContainer.innerHTML = `
                        <div class="status-badge-valid">
                            <i class="fa-solid fa-circle-check" style="font-size: 20px;"></i> DOCUMENTO VÁLIDO E AUTÊNTICO
                        </div>
                    `;

                    detailsContainer.innerHTML = `
                        <div class="info-row">
                            <span class="info-label">Status do Registro:</span>
                            <span class="info-value" style="color: #4ade80;">ATIVO E REGULAR</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Identificador / Token:</span>
                            <span class="info-value">${token.toUpperCase()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Padrão Legal:</span>
                            <span class="info-value">Lei Federal 12.933/13</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Certificação Digital:</span>
                            <span class="info-value">ICP-Brasil / ITI</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Validade Oficial:</span>
                            <span class="info-value" style="color: #f59e0b;">Até 31/03/${proximoAno}</span>
                        </div>
                    `;
                } else {
                    // Caso o QR code seja inválido, adulterado ou vazio
                    badgeContainer.innerHTML = `
                        <div class="status-badge-invalid">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 20px;"></i> DOCUMENTO INVÁLIDO OU NÃO ENCONTRADO
                        </div>
                    `;

                    detailsContainer.innerHTML = `
                        <div class="info-row">
                            <span class="info-label">Status do Registro:</span>
                            <span class="info-value" style="color: #f87171;">REJEITADO / FRAUDE</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Motivo:</span>
                            <span class="info-value">Token de segurança ausente ou corrompido.</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Orientações:</span>
                            <span class="info-value" style="font-size: 11px; color: #94a3b8;">Exija a apresentação da carteira digital oficial diretamente no aplicativo ou portal.</span>
                        </div>
                    `;
                }
            }, 1500); // Pequeno delay simulando checagem de servidor seguro
        };
    </script>
</body>
</html>
