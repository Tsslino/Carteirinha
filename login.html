<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Carteirinha Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-green-500">DNE Oficial</h1>
            <p class="text-gray-400 text-sm mt-1">Acesse sua Carteirinha Digital de Estudante</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">CPF</label>
                <input type="text" id="loginCpf" required 
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-green-500 transition" 
                    placeholder="000.000.000-00">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Senha</label>
                <input type="password" id="loginSenha" required 
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-green-500 transition" 
                    placeholder="Sua senha de acesso">
            </div>

            <button type="submit" id="btnEntrar" 
                class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-green-500/30 transition duration-200">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center space-y-2">
            <button onclick="abrirModalRecuperacao()" 
                class="text-sm text-green-400 hover:text-green-300 transition underline">
                Esqueci minha senha
            </button>
            <div class="pt-2 border-t border-gray-700">
                <a href="index.html" class="text-xs text-gray-400 hover:text-white transition">
                    ← Voltar à página inicial ou <span class="text-green-400 font-bold">Emitir Nova Carteirinha</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Modal de Recuperação de Senha -->
    <div id="modalRecuperacao" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-gray-700">
            <h3 class="text-xl font-bold text-white mb-2">Recuperar Senha</h3>
            <p class="text-xs text-gray-400 mb-4">Informe o seu CPF abaixo. Enviaremos as instruções de acesso.</p>

            <input type="text" id="recupCpf" 
                class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-green-500 transition mb-4 text-sm" 
                placeholder="Digite seu CPF">

            <div class="flex justify-end space-x-3">
                <button onclick="fecharModalRecuperacao()" 
                    class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-medium transition">
                    Cancelar
                </button>
                <button onclick="enviarRecuperacao()" id="btnEnviarLink" 
                    class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-xl text-sm font-bold shadow-lg transition">
                    Enviar
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginCpf').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v.slice(0, 14);
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cpf = document.getElementById('loginCpf').value;
            const senha = document.getElementById('loginSenha').value;
            const btn = document.getElementById('btnEntrar');

            btn.disabled = true;
            btn.innerText = 'Autenticando...';

            try {
                const res = await fetch('/api/pagamento?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cpf, senha })
                });

                const data = await res.json();

                if (res.ok && data.encontrado) {
                    localStorage.setItem('carteirinha_usuario', JSON.stringify(data));
                    alert('Login realizado com sucesso!');
                    window.location.href = 'carteirinha.html';
                } else {
                    alert(data.message || data.error || 'Erro ao realizar login.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Entrar';
            }
        });

        function abrirModalRecuperacao() { 
            document.getElementById('modalRecuperacao').classList.remove('hidden'); 
        }
        
        function fecharModalRecuperacao() { 
            document.getElementById('modalRecuperacao').classList.add('hidden'); 
        }

        async function enviarRecuperacao() {
            const cpf = document.getElementById('recupCpf').value;
            if (!cpf) return alert('Por favor, digite seu CPF.');
            alert('Instruções enviadas para o e-mail cadastrado associado a este CPF.');
            fecharModalRecuperacao();
        }
    </script>
</body>
</html>
